name: Validate preview source

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --input-type=module --check < app.js
          node --input-type=module --check < design-data.js
          node --input-type=module --check < archive-data.js
      - name: Validate page metadata, static content and local assets
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          const pages = ['index.html', 'archive/index.html', 'event/index.html', 'store/index.html'];
          for (const page of pages) {
            const html = fs.readFileSync(page, 'utf8');
            assert.match(html, /<html lang="ko">/, page + ': Korean language declaration missing');
            assert.match(html, /<meta name="robots" content="noindex, nofollow">/, page + ': preview must stay noindex');
            assert.match(html, /<meta name="description"/, page + ': meta description missing');
            assert.match(html, /<meta property="og:title"/, page + ': Open Graph title missing');
            const blocks = [...html.matchAll(/<script type="application\/ld\+json">([\s\S]*?)<\/script>/g)];
            assert.ok(blocks.length, page + ': JSON-LD missing');
            for (const block of blocks) JSON.parse(block[1]);
            for (const match of html.matchAll(/(?:src|href)="([^"]+)"/g)) {
              const url = match[1];
              if (/^(https?:|mailto:|tel:|#|javascript:)/.test(url) || url.includes('#/')) continue;
              const local = url.split('?')[0];
              if (!local || local.endsWith('/')) continue;
              const resolved = path.posix.normalize(path.posix.join(path.posix.dirname(page), local));
              assert.ok(fs.existsSync(resolved), page + ': missing local file ' + url + ' -> ' + resolved);
            }
          }
          const home = fs.readFileSync('index.html', 'utf8');
          assert.match(home, /<h1 id="hero-title">Crafted for your moment<\/h1>/, 'main page should be statically readable before JavaScript');
          assert.match(home, /HERITZ MOMENTS/, 'main page customer gallery text missing');
          const app = fs.readFileSync('app.js', 'utf8');
          assert.ok(app.includes('const SEO_METADATA'), 'route-specific metadata map missing');
          assert.ok(app.includes('updateSEO(route);'), 'route-specific metadata update missing');
          const robots = fs.readFileSync('robots.txt', 'utf8');
          assert.match(robots, /User-agent:\s*\*/);
          assert.match(robots, /Allow:\s*\//);
          assert.ok(fs.existsSync('llms.txt'), 'llms.txt missing');
          console.log('JavaScript, metadata, JSON-LD, noindex, static home content and local assets validated.');
          NODE
      - name: Smoke-test published GitHub Pages routes
        run: |
          set -eu
          check_page() {
            route="$1"
            expected="$2"
            url="https://5banjang.github.io/heritz-preview/${route}"
            attempt=1
            while [ "$attempt" -le 24 ]; do
              status=$(curl -sSL -o /tmp/heritz-page.html -w "%{http_code}" "$url" || true)
              if [ "$status" = "200" ] && grep -q "$expected" /tmp/heritz-page.html; then
                grep -q 'noindex, nofollow' /tmp/heritz-page.html
                echo "OK $url"
                return 0
              fi
              echo "Waiting for published page: $url (HTTP ${status:-unknown}, attempt $attempt)"
              attempt=$((attempt+1))
              sleep 5
            done
            echo "Preview page did not pass smoke test: $url"
            exit 1
          }
          check_page "" 'id="hero-title"'
          check_page "archive/" 'HERITZ MOMENTS'
          check_page "event/" 'HERITZ EVENT'
          check_page "store/" 'STORE'
      - name: Browser smoke-test core navigation and images
        run: |
          npm install --no-save playwright
          npx playwright install chromium
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';
          const base = 'https://5banjang.github.io/heritz-preview/';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1280,height:900}});
          const pageErrors = [];
          page.on('pageerror', error => pageErrors.push(error.message));
          try {
            await page.goto(base, {waitUntil:'networkidle'});
            await page.waitForSelector('#hero-title');
            assert.equal(await page.locator('#hero-title').innerText(), 'Crafted for your moment');
            assert.ok(await page.locator('#app .site-header').count(), 'main header missing after JavaScript render');
            assert.ok(await page.locator('#app .floating-contact a[href^="https://naver.me/"]').count(), 'Naver booking link missing');
            assert.ok(await page.locator('#app .floating-contact a[href^="https://pf.kakao.com/"]').count(), 'Kakao consultation link missing');
            const heroImage = await page.locator('.hero-photo img.crop-0').evaluate(img => ({complete:img.complete,width:img.naturalWidth}));
            assert.ok(heroImage.complete && heroImage.width > 0, 'hero image failed to load');
            await page.locator('.gallery-button').click();
            await page.waitForURL('**/heritz-preview/archive/');
            await page.waitForSelector('.customer-card');
            assert.equal(await page.title(), '고객 갤러리 | HERITZ TAILOR');
            assert.ok(await page.locator('.customer-card').count() >= 4, 'customer gallery cards missing');
            const galleryImage = await page.locator('.customer-card img.crop-0').first().evaluate(img => ({complete:img.complete,width:img.naturalWidth}));
            assert.ok(galleryImage.complete && galleryImage.width > 0, 'gallery image failed to load');
            await page.locator('#open-menu').click();
            assert.ok(await page.locator('#menu-dialog').evaluate(dialog => dialog.open), 'navigation dialog did not open');
            assert.ok(await page.locator('#menu-navigation a').count() >= 5, 'navigation links missing');
            await page.goto(base + 'event/', {waitUntil:'networkidle'});
            await page.waitForSelector('.event-main');
            assert.ok(await page.locator('.event-category-tabs a').count() >= 2, 'event category navigation missing');
            await page.goto(base + 'store/', {waitUntil:'networkidle'});
            await page.waitForSelector('.store-detail');
            assert.ok(await page.locator('.store-info').count(), 'store information missing');
            assert.equal(pageErrors.length, 0, 'JavaScript errors: ' + pageErrors.join('; '));
            console.log('Browser smoke test passed: home render, gallery navigation, gallery image, menu, booking/contact links, events and store.');
          } finally {
            await browser.close();
          }
          NODE
